<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz | Little Paws</title>
  <link rel="stylesheet" href="styles.css">
  <script src="quiz.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header>
    <p class="site-name">Little Paws</p>
    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="animals.html">Animals</a>
      <a href="care.html">Pet care</a>
      <a href="quiz.html" aria-current="page">Quiz</a>
    </nav>
  </header>

  <main id="main">
    <h1>Animal quiz</h1>
    <p>Pick an answer and check what you know about cats and dogs.</p>

    <form class="quiz-card" id="animal-quiz">
      <fieldset>
        <legend>Which pet often likes climbing and resting in high places?</legend>

        <label class="quiz-option">
          <input type="radio" name="answer" value="cat">
          <span>A cat</span>
        </label>

        <label class="quiz-option">
          <input type="radio" name="answer" value="dog">
          <span>A dog</span>
        </label>
      </fieldset>

      <button class="quiz-button" type="submit">Check my answer</button>
      <p class="quiz-result" id="quiz-result" role="status" aria-live="polite">Your answer will appear here.</p>
    </form>

    <p><a href="animals.html">Read the animal guide for more information.</a></p>
  </main>

  <footer>
    <p>Little Paws — An animal guide</p>
  </footer>
</body>
</html>
